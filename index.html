<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fresh cut</title>
<meta name="robots" content="noindex">
<link rel="icon" href="mask.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;700;900&display=swap" rel="stylesheet">
<!-- no box. just type it. -->
<style>
  :root {
    --black: #000;
    --dim: #4a120a;
    --red: #87000a;
    --hot: #f41a00;
    --orange: #f99300;
    --yellow: #ffd34d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--black); color: var(--dim); }
  body {
    font-family: "Tektur", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 64px;
    overflow-x: hidden;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(40px, 11vw, 96px);
    letter-spacing: 0.06em;
    color: var(--hot);
    text-shadow: 3px 0 var(--red), -2px 0 #2a0000;
  }
  .sub { margin-top: 4px; font-size: 14px; letter-spacing: 0.4em; color: var(--red); }
  .mask {
    width: min(620px, 92vw);
    margin: 40px 0 24px;
    filter: drop-shadow(0 0 2px var(--hot)) drop-shadow(0 0 14px var(--red));
    animation: twitch 2.6s steps(1) infinite;
  }
  @keyframes twitch {
    0% { transform: translate(0, 0); }
    71% { transform: translate(-3px, 1px) skewX(-2deg); }
    73% { transform: translate(2px, -1px); }
    75% { transform: translate(0, 0); }
    92% { transform: translate(1px, 2px) scale(1.01); }
    94% { transform: translate(0, 0); }
  }
  h2 { margin: 8px 0 18px; font-size: 13px; font-weight: 400; letter-spacing: 0.5em; color: var(--red); }
  ul { list-style: none; margin: 0; padding: 0; width: min(360px, 90vw); }
  li {
    display: flex;
    justify-content: space-between;
    padding: 9px 2px;
    border-bottom: 1px dashed #2a0804;
    font-size: 20px;
  }
  li b { color: var(--hot); font-weight: 900; font-size: 26px; line-height: 20px; }
  li span:last-child { color: #3a0d07; font-size: 14px; letter-spacing: 0.1em; align-self: flex-end; }
  .end {
    margin-top: 56px;
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--orange);
    text-align: center;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.07;
    mix-blend-mode: screen;
    image-rendering: pixelated;
  }
  @media (prefers-reduced-motion: reduce) {
    .mask, .end { animation: none; }
    canvas { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>FRESH CUT</h1>
    <div class="sub">FISH MARKET &middot; OPEN LATE</div>
  </header>

  <img class="mask" src="mask.png" alt="">

  <h2>TODAY'S CATCH</h2>
  <ul>
    <li><span><b>B</b>ass</span><span>sold out</span></li>
    <li><span><b>U</b>rchin</span><span>sold out</span></li>
    <li><span><b>T</b>una</span><span>sold out</span></li>
    <li><span><b>C</b>lams</span><span>sold out</span></li>
    <li><span><b>H</b>alibut</span><span>sold out</span></li>
    <li><span><b>E</b>el</span><span>sold out</span></li>
    <li><span><b>R</b>ockfish</span><span>you</span></li>
  </ul>

  <p class="end">say what i am where it all starts.</p>

  <canvas id="snow"></canvas>

<script>
  // faint crt snow, about 12 frames a second
  const snow = document.getElementById("snow");
  const pen = snow.getContext("2d");
  const size = 160;
  snow.width = size;
  snow.height = size;
  const frame = pen.createImageData(size, size);
  function draw() {
    for (let i = 0; i < frame.data.length; i += 4) {
      const v = Math.random() * 255;
      frame.data[i] = v;
      frame.data[i + 1] = v * 0.25;
      frame.data[i + 2] = v * 0.1;
      frame.data[i + 3] = 255;
    }
    pen.putImageData(frame, 0, 0);
  }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches === false) {
    setInterval(draw, 83);
  }
  draw();
</script>
</body>
</html>
